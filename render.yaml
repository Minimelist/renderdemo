services:
  # Node.js Backend API
  - type: web
    name: task-manager-node-api
    runtime: node
    plan: free
    buildCommand: cd backend-node && npm install
    startCommand: cd backend-node && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # Python Backend API
  - type: web
    name: task-manager-python-api
    runtime: python
    plan: free
    buildCommand: cd backend-python && pip install -r requirements.txt
    startCommand: cd backend-python && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: task-manager-db
    plan: free