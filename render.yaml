services:
  # Node.js Backend API
  - type: web
    name: task-manager-node-api
    runtime: node
    plan: free
    rootDir: backend-node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # Python Backend API
  - type: web
    name: task-manager-python-api
    runtime: python
    plan: free
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: task-manager-db
    plan: free

  # Frontend Static Site
  - type: web
    name: task-manager-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://task-manager-api.onrender.com/api

# PostgreSQL Database
databases:
  - name: task-manager-db
    databaseName: task_manager
    user: task_manager_user