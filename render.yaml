services:
  # Node.js Backend API
  - type: web
    name: task-manager-node-api
    runtime: node
    plan: free
    rootDir: backend-node  # IMPORTANT: Points to Node.js subdirectory
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # Python Backend API
  - type: web
    name: task-manager-python-api
    runtime: python
    plan: free
    rootDir: backend-python  # IMPORTANT: Points to Python subdirectory
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: task-manager-db
    plan: free