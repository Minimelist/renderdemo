services:
  # Node.js Backend API
  - type: web
    name: task-manager-node-api
    runtime: node
    plan: free
    rootDir: backend-node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # Python Backend API
  - type: web
    name: task-manager-python-api
    runtime: python
    plan: free
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # React Frontend as Web Service
  - type: web
    name: task-manager-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: |-
      npm install
      npm run build
      npm install -g serve
    startCommand: serve -s build -l $PORT
    envVars:
      - key: REACT_APP_API_URL
        value: https://task-manager-node-api.onrender.com
      - key: REACT_APP_PYTHON_API_URL
        value: https://task-manager-python-api.onrender.com

databases:
  - name: task-manager-db
    plan: free